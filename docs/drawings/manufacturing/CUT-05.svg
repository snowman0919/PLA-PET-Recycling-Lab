<line x1="20" y1="398" x2="1103" y2="398" stroke="#111"/><text x="28" y="418" font-size="11">Drawing MFG-CUT-05 | Part CUT-05 — 20 mm keyed cutter shaft | Qty 2</text>
<text x="28" y="439" font-size="11">Rev final-design-fabrication-closure-v0.8 | Units mm | Scale NTS, dimensions govern | Third-angle projection | source commit</text>
<text x="28" y="460" font-size="11">df59fd138780f538a5fa62dad6e2770b49bf4d94</text>
<text x="28" y="481" font-size="11">Material: S45C normalized steel HB 170-229 | Process/finish: turn + keyway; black oxide with bearing seats masked</text>
<text x="28" y="502" font-size="11">Overall: X 20.000 × Y 240.000 × Z 20.000 mm | general tolerance ISO 2768-m unless noted</text>
<text x="28" y="523" font-size="11">Critical: diameter 20 h6 at two 6004 journals per shaft; overall 240.0 +/-0.10; TIR &lt;=0.05; 6 mm keyways at y=0-35, 55-160 and 195-240 from datum</text>
<text x="28" y="544" font-size="11">end; keyway depth 3.5; install driven shaft at Y258 and slave shaft at Y278 to preserve 20 mm front sprocket clearance; use standard metal clamp</text>
<text x="28" y="565" font-size="11">collars for axial retention</text>
<text x="28" y="586" font-size="11">GD&amp;T/datums: A=common journal axis; B=drive-end shoulder/face; C=keyway or retaining feature plane; verify datum marking on supplier inspection</text>
<text x="28" y="607" font-size="11">report</text>
<text x="28" y="628" font-size="11">Inspection: CMM/caliper against STEP and drawing; deburr and visual crack/warp inspection; micrometer bearing seats; dial-indicator TIR/runout</text>
<text x="28" y="649" font-size="11">between centres</text>
<text x="28" y="670" font-size="11">Edges: remove burrs; break unspecified sharp edges C0.3–0.5. No unapproved material/tolerance substitution.</text>
<text x="28" y="691" font-size="11">Release: PASS — physical validation NOT_RUN; procurement and machining USER_APPROVAL_REQUIRED.</text></g></svg>

<text x="28" y="439" font-size="11">Rev final-design-fabrication-closure-v0.8 | Units mm | Scale NTS, dimensions govern | Third-angle projection | source commit</text>
<text x="28" y="460" font-size="11">df59fd138780f538a5fa62dad6e2770b49bf4d94</text>
<text x="28" y="481" font-size="11">Material: 1 mm galvanized steel | Process/finish: laser + brake + service-cover hardware</text>
<text x="28" y="502" font-size="11">Overall: X 165.000 × Y 48.000 × Z 190.000 mm | general tolerance ISO 2768-m unless noted</text>
<text x="28" y="523" font-size="11">Critical: 165 x48 x190; two Ø26 shaft clearances at X20/68,Z55; open service face; positive-opening interlock flag; PE bond</text>
<text x="28" y="544" font-size="11">GD&amp;T/datums: A=frame mounting plane; B=primary edge; C=mounting-hole centreline; verify datum marking on supplier inspection report</text>
<text x="28" y="565" font-size="11">Inspection: CMM/caliper against STEP and drawing; deburr and visual crack/warp inspection; fit-up, PE bond where metal, reach/access and</text>
<text x="28" y="586" font-size="11">interlock actuation inspection</text>
<text x="28" y="607" font-size="11">Edges: remove burrs; break unspecified sharp edges C0.3–0.5. No unapproved material/tolerance substitution.</text>
<text x="28" y="628" font-size="11">Release: PASS — physical validation NOT_RUN; procurement and machining USER_APPROVAL_REQUIRED.</text></g></svg>

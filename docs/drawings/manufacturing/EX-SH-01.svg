<text x="28" y="460" font-size="11">df59fd138780f538a5fa62dad6e2770b49bf4d94</text>
<text x="28" y="481" font-size="11">Material: 2 mm 5052 aluminum | Process/finish: laser + two 90deg bends; bond PE</text>
<text x="28" y="502" font-size="11">Overall: X 335.000 × Y 75.000 × Z 85.000 mm | general tolerance ISO 2768-m unless noted</text>
<text x="28" y="523" font-size="11">Critical: 335 x75 x85; open bottom/ends; feeder opening Ø50 at X314/Y37; &gt;=10 mm ABS-duct gap; edge hem/deburr</text>
<text x="28" y="544" font-size="11">GD&amp;T/datums: A=frame mounting plane; B=primary edge; C=mounting-hole centreline; verify datum marking on supplier inspection report</text>
<text x="28" y="565" font-size="11">Inspection: CMM/caliper against STEP and drawing; deburr and visual crack/warp inspection; fit-up, PE bond where metal, reach/access and</text>
<text x="28" y="586" font-size="11">interlock actuation inspection</text>
<text x="28" y="607" font-size="11">Edges: remove burrs; break unspecified sharp edges C0.3–0.5. No unapproved material/tolerance substitution.</text>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filament-recycler-pi"
version = "0.1.0"
description = "Raspberry Pi supervisory software for the filament recycler"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["recycler*"]

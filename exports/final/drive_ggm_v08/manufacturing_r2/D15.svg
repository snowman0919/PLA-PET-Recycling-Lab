ck 절단</text><text x="990" y="169" font-size="13" font-weight="normal">4x4: 길이25(2개),22(1),15(1),17(1). 6x6:</text><text x="990" y="190" font-size="13" font-weight="normal">길이20(1개). 표의 bbox는 회전 배치 크기일 수</text><text x="990" y="211" font-size="13" font-weight="normal">있다.</text><text x="990" y="241" font-size="13" font-weight="normal">4 mm 폭3.985~4.000, 6 mm 폭5.985~6.000;</text><text x="990" y="262" font-size="13" font-weight="normal">높이는 nominal-0.03/0, 길이-0.20/0.</text><text x="990" y="292" font-size="13" font-weight="normal">키홈 천장과 키 상면0.10 이상 여유. 버 제거</text><text x="990" y="313" font-size="13" font-weight="normal">C0.1, 억지 타격 금지. 실제 flank contact와</text><text x="990" y="334" font-size="13" font-weight="normal">손회전 확인.</text><text x="35" y="652" font-size="14" font-weight="bold">정확한 원통면 좌표: 원점은 해당 부품 bbox 최소점. 축 열이 가공 방향.</text><text x="35" y="679" font-size="12" font-weight="bold">ID</text><text x="100" y="679" font-size="12" font-weight="bold">형식</text><text x="170" y="679" font-size="12" font-weight="bold">축</text><text x="220" y="679" font-size="12" font-weight="bold">D mm</text><text x="330" y="679" font-size="12" font-weight="bold">좌표축</text><text x="420" y="679" font-size="12" font-weight="bold">U mm</text><text x="540" y="679" font-size="12" font-weight="bold">V mm</text><text x="680" y="679" font-size="12" font-weight="bold">축시작</text><text x="810" y="679" font-size="12" font-weight="bold">축끝</text><path d="M25,883 L1375,883" fill="none" stroke="#222" stroke-width="0.8"/><text x="30" y="908" font-size="12" font-weight="normal">수량 6 | GGM_SH_MotorKey, GGM_SH_JackInputKey, GGM_SH_JackSprocketKey, GGM_EX_MotorKey, GGM_EX_ScrewKey, GGM_SH_CutterKey</text><text x="30" y="932" font-size="12" font-weight="normal">선삭단/보어 치수는 원통면 표, 키홈/탭/용접/공차는 우측 주기 우선. PDF/SVG 선을 CNC 경로로 사용하지 않는다.</text><text x="30" y="954" font-size="12" font-weight="normal">원본은 해당 STEP + drawing_manifest.json SHA-256. 실측값을 생성하지 않았으며 본체/통전 승인은 HOLD.</text></g></svg>
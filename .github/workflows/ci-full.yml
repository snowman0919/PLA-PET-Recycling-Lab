name: CI-FULL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppr-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cad-and-firmware-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Current FreeCAD geometry regressions
        run: nix develop --command python3 validation/ci_v08.py --suite cad
      - name: Exact released AVR firmware replay
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            mkdir -p .build/ci-v08/firmware/tmp
            export TMPDIR="$PWD/.build/ci-v08/firmware/tmp"
            arduino-cli core update-index
            arduino-cli core install arduino:avr@1.8.8
            python3 exports/final/firmware/reproducible_build/build_and_verify.py | tee .build/ci-v08/firmware/rebuild.log
          '
      - name: Upload CAD and firmware evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppr-v08-cad-firmware-${{ github.sha }}
          path: |
            .build/ci-v08/cad/result.json
            .build/ci-v08/cad/SUMMARY.md
            .build/ci-v08/cad/*.log
            .build/ci-v08/firmware/rebuild.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

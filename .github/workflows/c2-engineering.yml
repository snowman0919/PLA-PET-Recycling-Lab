name: C2 engineering contracts
on:
  push:
    branches: [main, redesign/c2-20260921]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2-numerical-contracts:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      # Pin OpenBLAS microarch kernels: DYNAMIC_ARCH otherwise selects
      # different kernels per host CPU (last-ulp drift vs frozen manifests).
      # Artifact-era selection is Cooperlake (numpy 1.26.4 wheel OpenBLAS).
      OPENBLAS_CORETYPE: "Cooperlake"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy==1.26.4" "scipy==1.11.4" "shapely==2.1.2"
      - run: python c2/src/run_study.py
      - run: python -m unittest discover -s c2/tests -v
      - run: python c2/src/train_performance.py --backend gp
      - run: python c2/src/train_performance.py --backend mlp --out c2/results/mlp_run
      - run: python c2/src/verify_artifacts.py
      - run: python c2.1/src/transmission.py
      - run: python -m unittest discover -s c2.1/tests -v
      - run: python c2.1/src/verify_artifacts.py
      - name: C2 is not hardware approval
        run: |
          python - <<'PY'
          import json
          r=json.load(open('c2/results/summary.json'))
          assert r['actual_dem_runs']==r['evidence_inventory']['actual_dem_runs']
          assert r['actual_physical_tests']==r['evidence_inventory']['actual_physical_tests']
          assert r['motor_status']=='UNSELECTED'
          assert r['p5_status']=='DIGITAL_SENSITIVITY_COMPLETE_PHYSICAL_QUALIFICATION_HOLD'
          assert r['procurement']==r['fabrication']==r['energization']=='HOLD'
          print('Numerical/CAD evidence only. No fabrication or energization release.')
          PY

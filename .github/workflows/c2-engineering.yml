name: C2 engineering contracts
on:
  push:
    branches: [main, redesign/c2-20260921]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2-numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy shapely
      - run: python c2/src/run_study.py
      - run: python -m unittest discover -s c2/tests -v
      - run: python c2/src/train_performance.py --backend gp
      - run: python c2/src/train_performance.py --backend mlp --out c2/results/mlp_run
      - run: python c2/src/verify_artifacts.py
      - name: C2 is not hardware approval
        run: |
          python - <<'PY'
          import json
          r=json.load(open('c2/results/summary.json'))
          assert r['actual_dem_runs']==0
          assert r['total_confirmed_cost_KRW'] is None
          assert r['motor_status']=='UNSELECTED'
          assert r['procurement']==r['fabrication']==r['energization']=='HOLD'
          print('Numerical/CAD evidence only. No fabrication or energization release.')
          PY

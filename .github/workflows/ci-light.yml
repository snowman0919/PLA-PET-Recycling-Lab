name: CI-LIGHT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppr-light-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install host verification tools
        run: sudo apt-get update && sudo apt-get install -y g++ poppler-utils
      - name: Install pinned numerical test dependency
        run: python3 -m pip install -r environment/ci-requirements.txt
      - name: Current v0.8 contracts, runtime and negative tests
        run: python3 validation/ci_v08.py --suite light
      - name: Upload current CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppr-v08-light-${{ github.sha }}
          path: |
            .build/ci-v08/light/result.json
            .build/ci-v08/light/SUMMARY.md
            .build/ci-v08/light/*.log
            validation/physical_v08/simulation_prerequisite.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
